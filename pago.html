<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Pago | Chela Sport</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#020617] text-white p-4 font-sans min-h-screen flex items-center justify-center">
    
    <div class="max-w-md w-full bg-slate-900 rounded-[2.5rem] border border-slate-800 overflow-hidden shadow-2xl">
        <div class="bg-indigo-600 p-8 text-center relative">
            <div id="bcv-floating" class="absolute top-4 right-4 bg-black/20 px-3 py-1 rounded-full text-[9px] font-black tracking-widest">BCV: --</div>
            <i class="fa-solid fa-university text-3xl mb-4"></i>
            <h1 id="titulo-pago" class="text-xl font-black uppercase tracking-widest">Reporte de Pago</h1>
            <p id="nombre-estudiante" class="text-[10px] font-bold opacity-80 uppercase mt-1">Cargando...</p>
        </div>

        <div class="p-6 space-y-6">
            <div class="text-center">
                <p class="text-[10px] text-slate-500 font-black uppercase tracking-widest mb-1">Monto a Cancelar</p>
                <h2 id="monto-usd" class="text-4xl font-black text-emerald-400">$0.00</h2>
                <p id="monto-bs" class="text-lg font-black text-slate-400 mt-1">Bs. 0.00</p>
            </div>

            <div class="bg-slate-950 p-5 rounded-2xl border border-slate-800 shadow-inner">
                <p class="text-[9px] text-indigo-400 font-black uppercase mb-3 text-center tracking-widest">Datos Pago Móvil</p>
                <div class="space-y-2 text-[11px] font-mono">
                    <div class="flex justify-between"><span class="text-slate-500">Banco:</span><span class="text-white font-bold">0134 - Banesco</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Teléfono:</span><span class="text-white font-bold">0412-2969255</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Cédula:</span><span class="text-white font-bold">V-10383082</span></div>
                </div>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="text-[10px] text-slate-500 font-black uppercase ml-2 mb-2 block">Referencia Bancaria (Obligatorio)</label>
                    <input type="text" id="ref" maxlength="6" inputmode="numeric" placeholder="Últimos 4 o 6 dígitos" class="w-full bg-slate-950 border border-slate-800 p-4 rounded-xl text-center font-black text-2xl text-cyan-400 tracking-[0.2em] outline-none focus:border-indigo-500">
                </div>

                <button onclick="enviarReporte()" id="btn-enviar" class="w-full bg-indigo-600 hover:bg-indigo-500 p-5 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg shadow-indigo-900/40 active:scale-95 transition-all">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Enviar Reporte
                </button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://ekvzmfsdshyoeggudksm.supabase.co';
        const SB_KEY = 'sb_publishable_Go6ZDuD9pg1pC3k-s89jiQ_65TEYGnd';
        const _sb = supabase.createClient(SB_URL, SB_KEY);

        const params = new URLSearchParams(window.location.search);
        const estId = params.get('id');
        const montoUSD = parseFloat(params.get('debt') || 0);
        const nombreUrl = params.get('name');
        const tipoUsuario = params.get('tipo'); 
        
        // AQUÍ ESTÁ LA MAGIA QUE FALTABA:
        const isBulk = params.get('bulk') === 'true';
        const phoneParam = params.get('phone');

        // Pedido resuelto de Preventa (items con producto_id + detalle), si viene de portal_preventa.html
        let pedidoPreventa = null;
        try {
            const pedidoParam = params.get('pedido');
            if (pedidoParam) pedidoPreventa = JSON.parse(pedidoParam);
        } catch (e) { console.error('No se pudo leer el pedido de preventa:', e); }

        let tasaGlobal = 0;

        async function init() {
            document.getElementById('monto-usd').innerText = `$${montoUSD.toFixed(2)}`;
            
            if (isBulk) {
                document.getElementById('titulo-pago').innerText = "Abono Familiar";
                document.getElementById('nombre-estudiante').innerText = `Familia: ${decodeURIComponent(nombreUrl)}`;
            } else if (nombreUrl) {
                document.getElementById('nombre-estudiante').innerText = `Deuda: ${decodeURIComponent(nombreUrl)}`;
            }
            
            try {
                const res = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
                const data = await res.json();
                tasaGlobal = data.promedio;
                document.getElementById('bcv-floating').innerText = `BCV: ${tasaGlobal.toFixed(2)}`;
                document.getElementById('monto-bs').innerText = `Bs. ${(montoUSD * tasaGlobal).toFixed(2)}`;
            } catch (e) { }
        }
        init();

        async function enviarReporte() {
            const ref = document.getElementById('ref').value.trim();
            const btn = document.getElementById('btn-enviar');

            if(ref.length < 4) return alert("⚠️ Ingresa los últimos dígitos de la referencia.");
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Procesando...';

            try {
                const montoBsCalculado = montoUSD * (tasaGlobal || 1);
                const nombreParaBD = decodeURIComponent(nombreUrl);

                // Ocultamos el teléfono dentro de "items" para que el verificador lo lea
                // Ocultamos el teléfono dentro de "items" para que el verificador lo lea
                const payloadVenta = {
                    id_orden: `ABO-${ref}-${Date.now().toString().slice(-4)}`,
                    total_usd: montoUSD,           
                    monto_original: montoBsCalculado, 
                    moneda: 'VES',
                    metodo_pago: 'PAGO_MOVIL',
                    ref_pago: ref,  // <--- ¡ESTO ES LO MÁS IMPORTANTE! Debe decir ref_pago
                    status: 'pendiente_verificacion', 
                    tasa_referencia: tasaGlobal,
                    items: [{ name: isBulk ? "Abono Conjunto Familiar" : "Abono de Deuda", price: montoUSD, qty: 1, phone: phoneParam }]
                };

                // Asignación inteligente para la Base de Datos
                if (isBulk) {
                    payloadVenta.estudiante_nombre = `[FAMILIA] ${nombreParaBD}`;
                } else if (tipoUsuario === 'personal') {
                    payloadVenta.personal_id = estId;
                    payloadVenta.estudiante_nombre = `[Personal] ${nombreParaBD}`;
                } else {
                    payloadVenta.estudiante_id = estId;
                    payloadVenta.estudiante_nombre = nombreParaBD;
                }

                // Si viene de Preventa Escolar, sobreescribimos items con el pedido resuelto
                // (producto_id ya calculado) y marcamos el pedido para descuento de stock al aprobar.
                if (pedidoPreventa && Array.isArray(pedidoPreventa.items)) {
                    payloadVenta.items = pedidoPreventa.items;
                    payloadVenta.tipo_pedido = 'preventa';
                    payloadVenta.detalle_pedido = pedidoPreventa.detalle;
                    payloadVenta.producto_preventa = pedidoPreventa.detalle ? pedidoPreventa.detalle.producto : null;
                    payloadVenta.stock_descontado = false;
                    payloadVenta.estudiante_nombre = nombreParaBD;
                }

                const { error: insertError } = await _sb.from('ventas').insert([payloadVenta]);
                if (insertError) throw insertError;

                // Envia al éxito
                window.location.href = "exito.html";

            } catch (e) {
                alert("Hubo un problema: " + e.message);
                btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Enviar Reporte';
            }
        }
    </script>
</body>
</html>
