<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envolvia | Verificador Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #020617; font-family: 'Inter', sans-serif; color: white; overflow-x: hidden; }
        .card-shadow { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
        .glow-border { border: 1px solid rgba(99, 102, 241, 0.3); box-shadow: inset 0 0 20px rgba(99,102,241,0.05); }
        .pulse-soft { animation: pulseSoft 3s infinite; }
        @keyframes pulseSoft { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- MODAL DE SEGURIDAD (PIN MAESTRO) -->
    <div id="modal-seguridad" class="fixed inset-0 bg-slate-950/95 z-[200] flex items-center justify-center p-4 backdrop-blur-md transition-all">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-[2.5rem] shadow-2xl text-center max-w-sm w-full relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-500"></div>
            <div class="w-20 h-20 bg-indigo-500/10 border border-indigo-500/20 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-lock text-3xl"></i>
            </div>
            <h2 class="text-white font-black uppercase tracking-widest mb-2 text-lg">Acceso Restringido</h2>
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-wider mb-8">Auditoría de Pagos • Chela Sport</p>
            
            <input type="password" id="pin-input" maxlength="4" placeholder="••••" class="w-full bg-slate-950 border border-slate-800 p-4 rounded-xl text-center text-3xl tracking-[0.5em] text-white outline-none focus:border-indigo-500 mb-6 font-black transition-colors">
            
            <button onclick="validarAcceso()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-5 rounded-2xl uppercase tracking-widest text-xs active:scale-95 transition-all shadow-lg shadow-indigo-900/50">
                Desbloquear Bóveda
            </button>
        </div>
    </div>

    <!-- PANEL PRINCIPAL DEL VERIFICADOR -->
    <div id="verificador-body" class="max-w-2xl mx-auto space-y-6 hidden opacity-0 transition-opacity duration-500">
        <header class="p-8 text-center bg-slate-900/80 backdrop-blur-xl rounded-[3rem] border border-slate-800 shadow-2xl relative">
            <div id="bcv-badge" class="absolute top-6 right-6 bg-slate-950 text-emerald-400 border border-emerald-500/30 px-4 py-2 rounded-xl text-[10px] font-black tracking-widest uppercase shadow-sm">
                <i class="fa-solid fa-rotate fa-spin mr-1"></i> BCV
            </div>
            <div class="inline-flex p-5 bg-indigo-600/10 rounded-full mb-4 border border-indigo-500/20">
                <i class="fa-solid fa-shield-check text-4xl text-indigo-500"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-black uppercase italic tracking-tighter mb-2">Verificador <span class="text-indigo-500">Pro</span></h1>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.3em]">Centro de Aprobaciones</p>
        </header>

        <!-- PESTAÑAS (TABS) -->
        <div class="flex gap-2 bg-slate-900 p-2 rounded-3xl border border-slate-800 shadow-lg">
            <button id="tab-pendientes" onclick="cambiarPestana('pendientes')" class="flex-1 py-4 rounded-[1.5rem] bg-indigo-600 text-white font-black text-[10px] sm:text-xs uppercase tracking-widest transition-all shadow-md">
                <i class="fa-solid fa-hourglass-half mr-1"></i> Pendientes
            </button>
            <button id="tab-historial" onclick="cambiarPestana('historial')" class="flex-1 py-4 rounded-[1.5rem] text-slate-400 hover:text-white hover:bg-slate-800 font-black text-[10px] sm:text-xs uppercase tracking-widest transition-all">
                <i class="fa-solid fa-clock-rotate-left mr-1"></i> Historial
            </button>
        </div>

        <!-- Notificación Flotante -->
        <div id="new-payment-alert" class="hidden bg-emerald-600 text-white p-4 rounded-2xl text-center font-black text-xs uppercase tracking-widest shadow-lg shadow-emerald-900/50 flex justify-center items-center gap-3">
            <span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-white"></span></span>
            ¡Nuevo pago recibido! Actualizando panel...
        </div>

        <!-- CONTENEDOR DE LISTAS -->
        <div id="lista-contenedor" class="space-y-6 pb-20"></div>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN Y SEGURIDAD
        // (SB_URL, SB_KEY, _sb y MASTER_PIN vienen de config.js)
        // ==========================================
        let tasaActual = 0;
        let pestanaActiva = 'pendientes';

        // Escuchar Enter en el PIN
        document.getElementById('pin-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') validarAcceso();
        });

        async function validarAcceso() {
            const input = document.getElementById('pin-input').value;
            if(input === MASTER_PIN) {
                document.getElementById('modal-seguridad').classList.add('hidden');
                const body = document.getElementById('verificador-body');
                body.classList.remove('hidden');
                setTimeout(() => body.classList.replace('opacity-0', 'opacity-100'), 50);
                iniciarSistema();
            } else {
                const inputEl = document.getElementById('pin-input');
                inputEl.classList.add('border-red-500', 'text-red-500');
                setTimeout(() => inputEl.classList.remove('border-red-500', 'text-red-500'), 1000);
                inputEl.value = '';
            }
        }

        async function iniciarSistema() {
            await getTasa();
            cargarPendientes();
            iniciarRealtime();
        }

        async function getTasa() {
            try {
                const res = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
                const data = await res.json();
                tasaActual = parseFloat(data.promedio);
                document.getElementById('bcv-badge').innerHTML = `BCV: <span class="text-white ml-1">Bs. ${tasaActual.toFixed(2)}</span>`;
            } catch (e) {
                document.getElementById('bcv-badge').innerText = "BCV: Error API";
            }
        }

        // ==========================================
        // 2. SISTEMA DE PESTAÑAS (TABS)
        // ==========================================
        function cambiarPestana(pestana) {
            pestanaActiva = pestana;
            const tabP = document.getElementById('tab-pendientes');
            const tabH = document.getElementById('tab-historial');
            
            if(pestana === 'pendientes') {
                tabP.className = "flex-1 py-4 rounded-[1.5rem] bg-indigo-600 text-white font-black text-[10px] sm:text-xs uppercase tracking-widest transition-all shadow-md";
                tabH.className = "flex-1 py-4 rounded-[1.5rem] text-slate-400 hover:text-white hover:bg-slate-800 font-black text-[10px] sm:text-xs uppercase tracking-widest transition-all";
                cargarPendientes();
            } else {
                tabH.className = "flex-1 py-4 rounded-[1.5rem] bg-indigo-600 text-white font-black text-[10px] sm:text-xs uppercase tracking-widest transition-all shadow-md";
                tabP.className = "flex-1 py-4 rounded-[1.5rem] text-slate-400 hover:text-white hover:bg-slate-800 font-black text-[10px] sm:text-xs uppercase tracking-widest transition-all";
                cargarHistorial();
            }
        }

       // ==========================================
        // 3. CARGAR PENDIENTES (CON FILTRO DE VALOR ABSOLUTO)
        // ==========================================
        async function cargarPendientes() {
            if(pestanaActiva !== 'pendientes') return;
            const contenedor = document.getElementById('lista-contenedor');
            contenedor.innerHTML = '<div class="text-center py-10"><i class="fa-solid fa-circle-notch fa-spin text-indigo-500 text-4xl"></i></div>';

            try {
                const { data: pendientes, error } = await _sb
                    .from('ventas')
                    .select('*')
                    .in('status', ['pendiente_verificacion', 'esperando_verificacion'])
                    .order('created_at', { ascending: false });

                if (error) throw error;
                
                if (!pendientes || pendientes.length === 0) {
                    contenedor.innerHTML = `
                        <div class="bg-slate-900/50 border border-slate-800 rounded-[3rem] p-12 text-center">
                            <div class="w-20 h-20 mx-auto bg-emerald-500/10 text-emerald-500 rounded-full flex items-center justify-center mb-6"><i class="fa-solid fa-check-double text-3xl"></i></div>
                            <h3 class="text-white font-black text-lg uppercase tracking-widest mb-2">Bandeja Limpia</h3>
                            <p class="text-[11px] text-slate-500 font-bold uppercase tracking-widest">No hay pagos pendientes por auditar.</p>
                        </div>`;
                    return;
                }

                contenedor.innerHTML = pendientes.map(v => {
                    const montoAbsoluto = Math.abs(parseFloat(v.total_usd || 0));
                    const montoBs = (montoAbsoluto * tasaActual).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    
                    const fecha = new Date(v.created_at).toLocaleString('es-VE', { day: '2-digit', month: 'short', hour: '2-digit', minute:'2-digit' });
                    const nombreCliente = v.estudiante_nombre || 'Venta / Abono en Caja';

                    let comprobanteVisual = '';
                    
                    // CORRECCIÓN: Ahora lee ref_pago
                    if (v.ref_pago) {
                        comprobanteVisual = `
                        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 mb-5 text-center shadow-inner">
                            <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">Referencia Bancaria Reportada</p>
                            <p class="text-3xl font-mono font-black text-cyan-400 tracking-[0.2em]">${v.ref_pago}</p>
                        </div>`;
                    } else {
                        comprobanteVisual = `
                        <div class="w-full h-16 border-2 border-dashed border-slate-800 rounded-2xl flex items-center justify-center mb-5">
                            <p class="text-[9px] text-slate-600 font-black uppercase">Falta número de referencia</p>
                        </div>`;
                    }

                    return `
                    <div class="bg-slate-900 p-6 md:p-8 rounded-[2.5rem] card-shadow relative overflow-hidden glow-border">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 text-[9px] font-black px-3 py-1 rounded-full uppercase italic"><i class="fa-solid fa-money-bill-transfer mr-1"></i> ${v.metodo_pago.replace('_', ' ')}</span>
                                <div class="text-5xl font-black text-emerald-400 mt-5 tracking-tighter">$${montoAbsoluto.toFixed(2)}</div>
                                <div class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Equivale a: <span class="text-white">Bs. ${montoBs}</span></div>
                            </div>
                        </div>

                        ${comprobanteVisual}

                        <div class="border-t border-slate-800 pt-5 mb-5">
                            <p class="text-[10px] text-slate-500 font-black uppercase tracking-widest mb-1">Cliente / Representante</p>
                            <p class="text-sm text-slate-200 font-bold uppercase"><i class="fa-solid fa-user-tag text-indigo-500 mr-2"></i>${nombreCliente}</p>
                            <p class="text-[9px] text-slate-600 font-bold uppercase mt-2"><i class="fa-solid fa-clock mr-1"></i> ${fecha}</p>
                        </div>

                        <div class="flex gap-3">
                            <button onclick="procesarPagoSeguro('${v.id}', '${v.id_orden}', '${v.estudiante_id}', ${montoAbsoluto}, 'completado')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg active:scale-95 transition-all flex justify-center items-center gap-2 pulse-soft">
                                <i class="fa-solid fa-check-double text-sm"></i> Aprobar
                            </button>
                            <button onclick="procesarPagoSeguro('${v.id}', '${v.id_orden}', '${v.estudiante_id}', ${montoAbsoluto}, 'rechazado')" class="bg-slate-950 text-red-500 px-6 py-4 rounded-2xl active:scale-95 border border-red-900/30 shadow-lg hover:bg-red-900/20 transition-all">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    </div>`;
                }).join('');
            } catch (err) { alert("Error de red: " + err.message); }
        }
       // ==========================================
        // 4. CARGAR HISTORIAL (CON FILTRO DE VALOR ABSOLUTO)
        // ==========================================
        async function cargarHistorial() {
            if(pestanaActiva !== 'historial') return;
            const contenedor = document.getElementById('lista-contenedor');
            contenedor.innerHTML = '<div class="text-center py-10"><i class="fa-solid fa-circle-notch fa-spin text-indigo-500 text-4xl"></i></div>';

            try {
                const { data: historial, error } = await _sb
                    .from('ventas')
                    .select('*')
                    .in('status', ['completado', 'rechazado'])
                    .in('metodo_pago', ['PAGO_MOVIL', 'TRANSFERENCIA'])
                    .order('created_at', { ascending: false })
                    .limit(50); 

                if (error) throw error;
                
                if (!historial || historial.length === 0) {
                    contenedor.innerHTML = `
                        <div class="bg-slate-900/50 border border-slate-800 rounded-[3rem] p-12 text-center">
                            <i class="fa-solid fa-folder-open text-4xl text-slate-700 mb-4 block"></i>
                            <p class="text-[11px] text-slate-500 font-bold uppercase tracking-widest">No hay historial reciente de pagos.</p>
                        </div>`;
                    return;
                }

                contenedor.innerHTML = historial.map(v => {
                    const montoAbsoluto = Math.abs(parseFloat(v.total_usd || 0));
                    const fecha = new Date(v.created_at).toLocaleString('es-VE', { day: '2-digit', month: 'short', hour: '2-digit', minute:'2-digit' });
                    const nombreCliente = v.estudiante_nombre || 'Venta / Abono en Caja';
                    
                    const statusBadge = v.status === 'completado' 
                        ? '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-[9px] font-black uppercase"><i class="fa-solid fa-check mr-1"></i> Aprobado</span>'
                        : '<span class="bg-red-500/10 text-red-400 border border-red-500/30 px-3 py-1 rounded-full text-[9px] font-black uppercase"><i class="fa-solid fa-xmark mr-1"></i> Rechazado</span>';

                    return `
                    <div class="bg-slate-900 p-6 md:p-8 rounded-[2.5rem] card-shadow relative overflow-hidden border border-slate-800 opacity-90 hover:opacity-100 transition-opacity">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest"><i class="fa-solid fa-hashtag mr-1"></i> ${v.id_orden || 'S/N'}</span>
                                <div class="text-3xl font-black text-slate-300 mt-2 tracking-tighter">$${montoAbsoluto.toFixed(2)}</div>
                            </div>
                            <div>
                                ${statusBadge}
                            </div>
                        </div>

                        ${v.ref_pago ? `<div class="mb-4 inline-block"><span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest block mb-1">Referencia</span><p class="text-sm font-mono font-black text-cyan-400 bg-slate-950 px-3 py-2 rounded-xl border border-slate-800"># ${v.ref_pago}</p></div>` : ''}
                        
                        <div class="border-t border-slate-800 pt-4 mt-2">
                            <p class="text-[10px] text-slate-500 font-black uppercase tracking-widest mb-1">Cliente / Representante</p>
                            <p class="text-sm text-slate-300 font-bold uppercase"><i class="fa-solid fa-user-tag text-slate-500 mr-2"></i>${nombreCliente}</p>
                            <div class="flex justify-between items-center mt-3">
                                <p class="text-[9px] text-slate-600 font-bold uppercase"><i class="fa-solid fa-clock mr-1"></i> ${fecha}</p>
                                <p class="text-[9px] font-bold text-slate-500 uppercase">${v.metodo_pago.replace('_', ' ')}</p>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            } catch (err) { alert("Error de red: " + err.message); }
        }
// ==========================================
        // 5. LÓGICA DE APROBACIÓN ESTRICTA (Y DISTRIBUCIÓN FAMILIAR BLINDADA)
        // ==========================================
       async function procesarPagoSeguro(idFila, idOrden, estudianteIdStr, montoUsd, nuevoEstado) {
            const accion = nuevoEstado === 'completado' ? 'APROBAR' : 'RECHAZAR';
            if(!confirm(`¿Estás seguro de ${accion} este pago por $${montoUsd}?`)) return;

            document.body.style.cursor = 'wait';

            try {
                let query = _sb.from('ventas').update({ status: nuevoEstado });
                
                if (idFila && idFila !== 'undefined' && idFila !== 'null') query = query.eq('id', idFila);
                else if (idOrden && idOrden !== 'undefined' && idOrden !== 'null') query = query.eq('id_orden', idOrden);
                else throw new Error("ID del pago extraviado.");

                const { error } = await query;
                if (error) throw error;

                // SI EL PAGO FUE APROBADO, SE COBRA LA DEUDA
                if (nuevoEstado === 'completado') {
                    
                    // Traemos la venta exacta para revisar si es Familiar
                    const { data: venta } = await _sb.from('ventas').select('*').eq('id', idFila).single();

                    // PEDIDO DE PREVENTA ESCOLAR: no toca deuda, descuenta stock por talla
                    if (venta && venta.tipo_pedido === 'preventa') {
                        if (!venta.stock_descontado) {
                            const itemsPedido = typeof venta.items === 'string' ? JSON.parse(venta.items) : (venta.items || []);
                            for (const item of itemsPedido) {
                                if (!item.producto_id) continue;
                                const { data: prod } = await _sb.from('productos').select('stock').eq('id', item.producto_id).single();
                                if (prod) {
                                    await _sb.from('productos').update({ stock: prod.stock - item.qty }).eq('id', item.producto_id);
                                }
                            }
                            await _sb.from('ventas').update({ stock_descontado: true }).eq('id', idFila);
                        }
                    }
                    else if (venta && venta.estudiante_nombre && venta.estudiante_nombre.includes('[FAMILIA]')) {
                        // 1. Extraer el nombre del representante limpiando la etiqueta "[FAMILIA]"
                        const repNombre = venta.estudiante_nombre.replace('[FAMILIA]', '').trim();
                        
                        // 2. Extraer teléfono oculto
                        let phoneFamilia = null;
                        try {
                            const itemsParsed = typeof venta.items === 'string' ? JSON.parse(venta.items) : venta.items;
                            phoneFamilia = itemsParsed && itemsParsed.length > 0 ? itemsParsed[0].phone : null;
                        } catch(e) {}
                        
                        // 3. Traer toda la base de datos de estudiantes (Es rapidísimo y 100% infalible)
                        const { data: todosEstudiantes } = await _sb.from('estudiantes').select('*');
                        let saldoRestante = parseFloat(montoUsd);
                        
                        if (todosEstudiantes) {
                            // Filtrar solo a los hijos que pertenezcan a este representante (por Teléfono O Nombre)
                            const hijosDeLaFamilia = todosEstudiantes.filter(h => {
                                const coincideTelefono = phoneFamilia && h.phone === phoneFamilia;
                                const coincideNombre = h.representante && h.representante.toLowerCase().includes(repNombre.toLowerCase());
                                return coincideTelefono || coincideNombre;
                            });

                            // Filtrar estrictamente a los que sí deben dinero
                            const hijosConDeuda = hijosDeLaFamilia.filter(h => parseFloat(h.debt || 0) > 0);

                            // 4. Matemáticas puras: Repartir el abono hijo por hijo hasta que se agote
                            for (let h of hijosConDeuda) {
                                if (saldoRestante <= 0.01) break; // Si ya se repartió todo, detenerse
                                
                                const deudaHijo = parseFloat(h.debt || 0);
                                const aDescontar = Math.min(deudaHijo, saldoRestante);
                                saldoRestante -= aDescontar;
                                
                                const nuevaDeuda = Math.max(0, deudaHijo - aDescontar);
                                await _sb.from('estudiantes').update({ debt: nuevaDeuda }).eq('id', h.id);
                            }
                        }
                    } 
                    // Si es un pago individual normal de un solo hijo o personal
                    else if (estudianteIdStr && estudianteIdStr !== 'undefined' && estudianteIdStr !== 'null') {
                        const { data: estData } = await _sb.from('estudiantes').select('debt').eq('id', estudianteIdStr).single();
                        if (estData) {
                            const nuevaDeuda = Math.max(0, parseFloat(estData.debt || 0) - parseFloat(montoUsd));
                            await _sb.from('estudiantes').update({ debt: nuevaDeuda }).eq('id', estudianteIdStr);
                        }
                    }
                }

                cargarPendientes();

            } catch (e) {
                alert("❌ Error crítico: " + e.message);
            } finally {
                document.body.style.cursor = 'default';
            }
        }
        // ==========================================
        // 6. NOTIFICACIONES REALTIME
        // ==========================================
        function iniciarRealtime() {
            const sonarAlerta = () => {
                const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                audio.play().catch(e=>console.log("Audio bloqueado por navegador"));
            };

            _sb.channel('ventas-reales').on('postgres_changes', 
                { event: 'INSERT', schema: 'public', table: 'ventas' }, 
                (payload) => {
                    const st = payload.new.status;
                    if(st === 'pendiente_verificacion' || st === 'esperando_verificacion') {
                        const alertBox = document.getElementById('new-payment-alert');
                        alertBox.classList.remove('hidden');
                        sonarAlerta();
                        if(pestanaActiva === 'pendientes') cargarPendientes();
                        setTimeout(() => alertBox.classList.add('hidden'), 5000);
                    }
                }
            ).subscribe();
        }
    </script>
</body>
</html>
